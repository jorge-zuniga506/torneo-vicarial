name: keep-alive

# Mantiene despierto el proyecto de Supabase (el plan free se pausa tras ~7
# días sin actividad). Corre cada 3 días y también se puede lanzar a mano.
on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC, cada 3 días
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keep-alive.mjs
